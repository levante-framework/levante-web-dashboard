<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Alternative Audio Clips</title>
    <link rel="icon" type="image/svg+xml" href="./audio-favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles.css">
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(12,126,155,0.08), transparent 42%),
                radial-gradient(circle at 100% 100%, rgba(181,120,26,0.06), transparent 42%);
            background-attachment: fixed;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .share-container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        header {
            margin-bottom: 28px;
        }

        .back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 2.3rem;
            margin: 0 0 10px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--text-primary);
        }

        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-button {
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            white-space: nowrap;
        }

        .action-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .approve-button {
            background: var(--accent);
            color: var(--accent-contrast);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
        }

        .approve-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .log-button {
            background: var(--accent-soft);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--accent-border);
        }

        .log-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .delete-button {
            background: var(--color-danger);
            color: var(--accent-contrast);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-danger-border);
        }

        .delete-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .folder-info {
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status {
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 22px;
            font-size: 0.95rem;
            background: var(--surface-2);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            box-shadow: var(--shadow-md);
        }

        .status.error {
            background: var(--color-danger-soft);
            color: var(--color-danger);
            border-color: var(--color-danger-border);
        }

        .status.success {
            background: var(--color-success-soft);
            color: var(--color-success);
            border-color: var(--color-success-border);
        }

        .status.loading {
            background: var(--color-warning-soft);
            color: var(--color-warning);
            border-color: var(--color-warning-border);
        }

        .activity-log-panel {
            display: none;
            margin-bottom: 22px;
            padding: 18px 22px;
            border-radius: 18px;
            background: var(--surface-1);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
        }

        .activity-log-panel.is-open {
            display: block;
        }

        .activity-log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .activity-log-header h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .activity-log-close {
            border: 1px solid var(--border-default);
            background: var(--surface-3);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .activity-log-close:hover {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-border);
        }

        .activity-log-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .activity-log-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            background: var(--surface-2);
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .activity-log-item .log-time {
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .activity-log-item.success {
            border-color: var(--color-success-border);
            background: var(--color-success-soft);
        }

        .activity-log-item.error {
            border-color: var(--color-danger-border);
            background: var(--color-danger-soft);
        }

        .activity-log-item.warning {
            border-color: var(--color-warning-border);
            background: var(--color-warning-soft);
        }

        .activity-log-empty {
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding: 12px 0;
            text-align: center;
        }

        .share-content {
            background: var(--surface-1);
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            padding: 24px 28px;
            overflow-x: auto;
            border: 1px solid var(--border-subtle);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }

        th:first-child,
        td:first-child {
            text-align: center;
        }

        .file-select-checkbox,
        thead input[type="checkbox"] {
            transform: scale(1.15);
            cursor: pointer;
        }

        th {
            background: var(--accent-soft);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        tr:hover {
            background: var(--surface-3);
        }

        code {
            background: var(--surface-3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--accent);
        }

        .empty-state {
            padding: 36px 0;
            text-align: center;
            color: var(--text-secondary);
        }

        .download-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .site-approval-cell { text-align: center; }
.site-approval-pill,
.status-pill {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            gap: 2px;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--surface-3);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .pill-subtext {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .site-approval-pill.is-approved,
.status-pill.status-approved {
            background: var(--color-success-soft);
            color: var(--color-success);
            border-color: var(--color-success-border);
            box-shadow: var(--shadow-sm);
        }

        .site-approval-pill.is-approved .pill-subtext,
.status-pill.status-approved .pill-subtext {
            color: var(--color-success);
        }

        .site-approval-pill.is-stale,
        .status-pill.status-stale {
            background: var(--color-warning-soft);
            color: var(--color-warning);
            border-color: var(--color-warning-border);
            box-shadow: var(--shadow-sm);
        }

        .site-approval-pill.is-stale .pill-subtext,
        .status-pill.status-stale .pill-subtext {
            color: var(--color-warning);
        }

        .status-pill.status-not-approved {
            background: var(--color-danger-soft);
            color: var(--color-danger);
            border-color: var(--color-danger-border);
            box-shadow: var(--shadow-sm);
        }

        .status-pill.status-not-approved .pill-subtext {
            color: var(--color-danger);
        }

        .status-pill.status-ready {
            background: var(--color-success-soft);
            color: var(--color-success);
            border-color: var(--color-success-border);
            box-shadow: var(--shadow-sm);
        }

        audio {
            width: 240px;
            max-width: 100%;
            filter: saturate(1.2);
        }

        .approval-note {
            margin-top: 26px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: none;
        }

        @media (max-width: 640px) {
            .share-container {
                padding: 28px 16px 36px;
            }

            .actions-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            h1 {
                font-size: 1.9rem;
            }

            th, td {
                padding: 10px;
            }

            audio {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="share-container">
        <header>
            <div class="back-bar">
                <a class="back-to-cockpit" href="./index.html">
                    <i class="fas fa-arrow-left"></i> Back to Cockpit
                </a>
            </div>
            <h1>Review Alternative Audio Clips</h1>
            <div class="actions-bar">
                <div>
                    <div id="folderInfo" class="folder-info">Preparing share view…</div>
                    <div class="language-filter">
                        <label for="languageFilter">Language:</label>
                        <select id="languageFilter">
                            <option value="">All languages</option>
                        </select>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="deleteSelected" class="action-button delete-button" disabled>Delete Selected</button>
                    <button id="approveSelected" class="action-button approve-button" disabled>Approve Selected</button>
                    <button id="viewLogButton" class="action-button log-button" type="button">Activity Log</button>
                </div>
            </div>
        </header>

        <div id="status" class="status loading">Loading draft audio…</div>

        <div id="activityLogPanel" class="activity-log-panel" aria-live="polite" aria-expanded="false">
            <div class="activity-log-header">
                <h2>Activity Log</h2>
                <button id="activityLogClose" class="activity-log-close" type="button" title="Close activity log">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul id="activityLogList" class="activity-log-list">
                <li class="activity-log-empty">No activity yet.</li>
            </ul>
        </div>

        <div id="content" class="share-content">
            <div class="empty-state">Fetching draft audio files…</div>
        </div>
        <p class="approval-note">By approving these updated translations you&apos;re agreeing that they are acceptable for your Levante Project site.</p>
    </div>

    <script src="./js/draft-share.js"></script>
</body>
</html>
