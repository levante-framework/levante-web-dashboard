<!DOCTYPE html>
<html lang="en
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locate Me Gallery · Levante</title>
  <link rel="icon" type="image/svg+xml" href="/images/location-pin.svg">
  <link rel="apple-touch-icon" href="/images/location-pin.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(255, 111, 0, 0.22), rgba(15, 23, 42, 0.94)), #020617;
      padding: 32px 20px 48px;
      color: #e2e8f0;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, rgba(255, 111, 0, 0.95), rgba(255, 146, 43, 0.9));
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 22px 48px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-actions a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border: 1px solid rgba(15, 23, 42, 0.22);
      background: rgba(255, 255, 255, 0.86);
      color: #0b1220;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .header-actions a:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.95);
    }
    .header-actions a:focus-visible {
      outline: 2px solid #facc15;
      outline-offset: 2px;
    }
    /* Make Back-to-Cockpit match the rest of Cockpit pages */
    .header-actions a.back-to-cockpit {
      gap: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(3, 12, 28, 0.78);
      color: #38bdf8;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .header-actions a.back-to-cockpit:hover {
      background: rgba(56, 189, 248, 0.85);
      color: #03101f;
      transform: translateY(-2px);
      box-shadow: 0 24px 48px rgba(56, 189, 248, 0.45);
    }
    header h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0b1220;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    header p {
      color: rgba(3, 7, 18, 0.9);
      font-size: 15px;
      font-weight: 600;
    }
    .stats {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e4e4e7;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #27272a;
    }
    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
      gap: 24px;
    }
    .gallery-item {
      background: rgba(7, 15, 28, 0.95);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(0, 160, 222, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .gallery-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 26px 52px rgba(0,0,0,0.55);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .gallery-item-info {
      padding: 12px 16px;
      font-size: 12px;
      color: #cbd5e1;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.55);
    }
    .gallery-item-info strong {
      color: #e2e8f0;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      padding: 40px;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      max-width: 90%;
      max-height: 90%;
      background: #0b1220;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .modal-content img {
      width: 100%;
      height: auto;
      display: block;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #27272a;
    }
    .filters {
      max-width: 1400px;
      margin: 0 auto 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 1px solid rgba(0, 160, 222, 0.28);
      background: rgba(7, 15, 28, 0.9);
      color: #e2e8f0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: rgba(0, 160, 222, 0.25);
      color: #ffffff;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #ff6f00, #ff9d2d);
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }
.legend {
  max-width: 1400px;
  margin: 0 auto 16px;
  display: none;
  gap: 10px;
  align-items: center;
  color: #e2e8f0;
  font-size: 14px;
}
.legend .swatch {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(0, 160, 222, 0.6);
}
  </style>
</head>
<body>
  <header>
    <div class="header-actions">
      <a class="back-to-cockpit" href="/index.html"><i class="fas fa-arrow-left"></i> Back to Cockpit</a>
      <a class="doc-link" href="/docs/locate-me-v2.html" target="_blank" rel="noopener noreferrer"><i class="fas fa-book-open"></i> Documentation</a>
    </div>
    <h1>📍 Locate Me Gallery</h1>
    <p id="subtitle">Visual results from the Locate-Me workflow</p>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Images</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Countries</div>
        <div class="stat-value" id="countryList">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Generated</div>
        <div class="stat-value" id="generatedDate">-</div>
      </div>
    </div>
  </header>
  <div class="legend" id="legend">
    <div class="swatch"></div>
    <span>City/Admin boundary (shown when polygon data is available)</span>
  </div>
  
  <div class="filters" id="filters"></div>
  
  <div class="gallery" id="gallery"></div>
  
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-content">
      <img id="modalImage" src="" alt="">
    </div>
  </div>
  
  <script>
    let galleryData = null;
    let currentFilter = 'all';
    let countries = [];
    
    function buildFilters(countryList) {
      const filtersEl = document.getElementById('filters');
      filtersEl.innerHTML = '';
      const addBtn = (label, code, active = false) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (active ? ' active' : '');
        btn.dataset.country = code;
        btn.textContent = label;
        filtersEl.appendChild(btn);
      };
      addBtn('All Countries', 'all', true);
      countryList.forEach(code => addBtn(code, code));
      filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.country;
          renderGallery();
        });
      });
    }
    
    async function loadGallery() {
      try {
        const response = await fetch('./gallery-data.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        galleryData = await response.json();
        
        if (!galleryData || !galleryData.results) {
          throw new Error('Invalid gallery data format');
        }
        
        // Show all results that have images (check if image exists or has polygon data)
        const resultsWithPolygons = galleryData.results.filter(result => {
          // Check for polygons in the legacy format (polygons array)
          const hasLegacyPolygon = result.polygons && result.polygons.some(p => p.polygon && p.polygon.geometry);
          // Check for polygons in the new format (cityArea/adminArea)
          const hasNewPolygon = (result.cityArea && result.cityArea.polygon && result.cityArea.polygon.geometry) ||
                                (result.adminArea && result.adminArea.polygon && result.adminArea.polygon.geometry);
          // If no polygon data, still show if we have geocode results (images should exist)
          const hasGeocodeData = result.geocode && result.geocode.results && result.geocode.results.length > 0;
          return hasLegacyPolygon || hasNewPolygon || hasGeocodeData;
        });
        document.getElementById('totalCount').textContent = resultsWithPolygons.length;
        const generatedDate = new Date(galleryData.generated);
        document.getElementById('generatedDate').textContent = generatedDate.toLocaleString();
        countries = Array.from(new Set(resultsWithPolygons.map(r => r.point.country)));
        document.getElementById('countryList').textContent = countries.join(', ');
        document.getElementById('subtitle').textContent = `Visual results from ${resultsWithPolygons.length} GPS points processed through the Locate-Me workflow`;
        buildFilters(countries);
        
        const legendEl = document.getElementById('legend');
        legendEl.style.display = resultsWithPolygons.length ? 'flex' : 'none';
        
        renderGallery();
      } catch (error) {
        console.error('Failed to load gallery data:', error);
        const isCorsError = error.message.includes('CORS') || error.message.includes('Failed to fetch') || window.location.protocol === 'file:';
        const errorMsg = isCorsError 
          ? '<p style="text-align:center;padding:40px;color:#fca5a5;">⚠️ CORS Error: Cannot load gallery-data.json via file:// URL.<br><br>Please view this page via:<br><br><a href="https://levante-cockpit.vercel.app/gallery/locate-me/" style="color:#38bdf8;text-decoration:underline;">https://levante-cockpit.vercel.app/gallery/locate-me/</a><br><br>Or run a local server:<br><code style="background:rgba(0,0,0,0.3);padding:4px 8px;border-radius:4px;">python3 -m http.server 8000 --directory public/gallery/locate-me</code></p>'
          : `<p style="text-align:center;padding:40px;color:#71717a;">Failed to load gallery data: ${error.message}<br><br>Make sure gallery-data.json exists and is accessible.</p>`;
        document.getElementById('gallery').innerHTML = errorMsg;
      }
    }
    
    function renderGallery() {
      const gallery = document.getElementById('gallery');
      
      if (!galleryData || !galleryData.results) {
        gallery.innerHTML = '<p style="text-align:center;padding:40px;color:#71717a;">No gallery data available.</p>';
        return;
      }
      
      // Show all results that have images (check if image exists or has polygon data)
      const resultsWithPolygons = galleryData.results.filter(result => {
        // Check for polygons in the legacy format (polygons array)
        const hasLegacyPolygon = result.polygons && result.polygons.some(p => p.polygon && p.polygon.geometry);
        // Check for polygons in the new format (cityArea/adminArea)
        const hasNewPolygon = (result.cityArea && result.cityArea.polygon && result.cityArea.polygon.geometry) ||
                              (result.adminArea && result.adminArea.polygon && result.adminArea.polygon.geometry);
        // If no polygon data, still show if we have geocode results (images should exist)
        const hasGeocodeData = result.geocode && result.geocode.results && result.geocode.results.length > 0;
        return hasLegacyPolygon || hasNewPolygon || hasGeocodeData;
      });
      
      const filtered = currentFilter === 'all' 
        ? resultsWithPolygons 
        : resultsWithPolygons.filter(r => r.point.country === currentFilter);
      
      gallery.innerHTML = filtered.length > 0 
        ? filtered.map(result => {
            const { point } = result;
            const cacheBuster = encodeURIComponent((galleryData && galleryData.generated) ? galleryData.generated : '');
            const imagePath = `./images/${point.id}.webp${cacheBuster ? `?v=${cacheBuster}` : ''}`;
            const cities = result.geocode.results.slice(0, 2).map(r => r.name).join(', ');
            const hasPolygon = result.polygons && result.polygons.some(p => p.polygon && p.polygon.geometry);
            const boundaryNote = hasPolygon ? '' : ' · no boundary data';
            
            return `
              <div class="gallery-item" onclick="openModal('${imagePath}')">
                <img src="${imagePath}" alt="${point.id}" loading="lazy" onerror="console.error('Failed to load image:', '${imagePath}'); this.parentElement.remove();">
                <div class="gallery-item-info">
                  <strong>${point.id}</strong> · ${point.country} · ${cities}${boundaryNote}
                </div>
              </div>
            `;
          }).join('')
        : '<p style="text-align:center;padding:40px;color:#71717a;">No images with polygons found.</p>';
    }
    
    function openModal(imagePath) {
      const modal = document.getElementById('modal');
      const modalImage = document.getElementById('modalImage');
      modalImage.src = imagePath;
      modal.classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.country;
        renderGallery();
      });
    });
    
    // Close modal on background click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        closeModal();
      }
    });
    
    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
    
    loadGallery();
  </script>
</body>
</html>
