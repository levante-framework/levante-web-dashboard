<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Audit - Levante Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0e27;
      color: #e2e8f0;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(255, 123, 0, 0.3);
    }
    
    h1 {
      color: #ff7b00;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .controls {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 123, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    label {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input, select {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 123, 0, 0.3);
      border-radius: 6px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #ff7b00;
      box-shadow: 0 0 0 3px rgba(255, 123, 0, 0.1);
    }
    
    input::placeholder {
      color: #64748b;
    }
    
    button {
      background: linear-gradient(135deg, #ff7b00 0%, #ff9500 100%);
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      color: #06141f;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 123, 0, 0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 123, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #ff7b00;
      margin-bottom: 5px;
    }
    
    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 1024px) {
      .results {
        grid-template-columns: 1fr;
      }
    }
    
    .result-section {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 123, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
    }
    
    .result-section h2 {
      color: #ff7b00;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .result-section.only-in-dev h2 {
      color: #ef4444;
    }
    
    .result-section.newer-in-dev h2 {
      color: #f59e0b;
    }
    
    .file-list {
      max-height: 600px;
      overflow-y: auto;
      margin-top: 10px;
    }
    
    .file-item {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    
    .file-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-left-color: #ff7b00;
    }
    
    .file-item.only-in-dev {
      border-left-color: #ef4444;
    }
    
    .file-item.newer-in-dev {
      border-left-color: #f59e0b;
    }
    
    .file-name {
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
      word-break: break-all;
      font-size: 13px;
    }
    
    .file-meta {
      display: flex;
      gap: 15px;
      font-size: 11px;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    
    .file-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge.only {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    
    .badge.newer {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    
    .loading i {
      font-size: 32px;
      color: #ff7b00;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 15px;
      color: #fca5a5;
      margin-bottom: 20px;
    }
    
    .empty {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-style: italic;
    }
    
    .filter-highlight {
      background: rgba(255, 123, 0, 0.2);
      padding: 2px 4px;
      border-radius: 3px;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #ff7b00;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">
      <i class="fas fa-arrow-left"></i>
      Back to Pitwall
    </a>
    
    <header>
      <h1><i class="fas fa-clipboard-check"></i> Asset Audit</h1>
      <p class="subtitle">Compare files between levante-assets-dev and levante-assets-prod</p>
    </header>
    
    <div class="controls">
      <div class="control-group">
        <label for="prefixFilter"><i class="fas fa-folder"></i> Folder Prefix</label>
        <input type="text" id="prefixFilter" placeholder="e.g., audio/, visual/" />
      </div>
      
      <div class="control-group">
        <label for="textFilter"><i class="fas fa-search"></i> Text Filter</label>
        <input type="text" id="textFilter" placeholder="Filter by filename..." />
      </div>
      
      <div class="control-group">
        <label for="excludeFilter"><i class="fas fa-ban"></i> Exclude Patterns</label>
        <input type="text" id="excludeFilter" placeholder="pt-PT, downex (comma-separated)" />
      </div>
      
      <div class="control-group" style="justify-content: flex-end;">
        <button id="refreshBtn" onclick="loadAudit()">
          <i class="fas fa-sync-alt"></i> Refresh Audit
        </button>
      </div>
    </div>
    
    <div id="statusSection" class="status" style="display: none;">
      <div class="stat-card">
        <div class="stat-value" id="devFileCount">0</div>
        <div class="stat-label">Files in Dev</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="prodFileCount">0</div>
        <div class="stat-label">Files in Prod</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="onlyInDevCount">0</div>
        <div class="stat-label">Only in Dev</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="newerInDevCount">0</div>
        <div class="stat-label">Newer in Dev</div>
      </div>
    </div>
    
    <div id="errorMessage" class="error" style="display: none;"></div>
    
    <div id="loadingMessage" class="loading" style="display: none;">
      <i class="fas fa-spinner fa-spin"></i>
      <p style="margin-top: 15px;">Loading asset comparison...</p>
    </div>
    
    <div id="resultsSection" class="results" style="display: none;">
      <div class="result-section only-in-dev">
        <h2><i class="fas fa-exclamation-triangle"></i> Files Only in Dev</h2>
        <div id="onlyInDevList" class="file-list"></div>
      </div>
      
      <div class="result-section newer-in-dev">
        <h2><i class="fas fa-clock"></i> Files Newer in Dev</h2>
        <div id="newerInDevList" class="file-list"></div>
      </div>
    </div>
  </div>
  
  <script>
    let currentData = null;
    let textFilterValue = '';
    
    // Load audit on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadAudit();
      
      // Add real-time text filtering
      document.getElementById('textFilter').addEventListener('input', (e) => {
        textFilterValue = e.target.value.toLowerCase();
        filterResults();
      });
      
      // Allow Enter key to refresh
      document.getElementById('prefixFilter').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadAudit();
      });
      document.getElementById('excludeFilter').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadAudit();
      });
    });
    
    async function loadAudit() {
      const prefix = document.getElementById('prefixFilter').value.trim();
      const exclude = document.getElementById('excludeFilter').value.trim();
      
      // Show loading
      document.getElementById('loadingMessage').style.display = 'block';
      document.getElementById('errorMessage').style.display = 'none';
      document.getElementById('statusSection').style.display = 'none';
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('refreshBtn').disabled = true;
      
      try {
        const params = new URLSearchParams();
        if (prefix) params.append('prefix', prefix);
        if (exclude) params.append('exclude', exclude);
        
        const response = await fetch(`/api/asset-audit?${params.toString()}`, { cache: 'no-cache' });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || `HTTP ${response.status}`);
        }
        
        const data = await response.json();
        currentData = data;
        
        // Update status
        document.getElementById('devFileCount').textContent = data.devFileCount.toLocaleString();
        document.getElementById('prodFileCount').textContent = data.prodFileCount.toLocaleString();
        document.getElementById('onlyInDevCount').textContent = data.summary.onlyInDevCount.toLocaleString();
        document.getElementById('newerInDevCount').textContent = data.summary.newerInDevCount.toLocaleString();
        
        document.getElementById('statusSection').style.display = 'grid';
        renderResults(data);
        
      } catch (error) {
        document.getElementById('errorMessage').textContent = `Error: ${error.message}`;
        document.getElementById('errorMessage').style.display = 'block';
      } finally {
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('refreshBtn').disabled = false;
      }
    }
    
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
    
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    
    function highlightText(text, filter) {
      if (!filter) return text;
      const regex = new RegExp(`(${filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<span class="filter-highlight">$1</span>');
    }
    
    function filterResults() {
      if (!currentData) return;
      renderResults(currentData);
    }
    
    function renderResults(data) {
      const textFilter = textFilterValue;
      
      // Filter and render "Only in Dev"
      const onlyInDev = textFilter 
        ? data.onlyInDev.filter(f => f.name.toLowerCase().includes(textFilter))
        : data.onlyInDev;
      
      const onlyInDevHtml = onlyInDev.length > 0
        ? onlyInDev.map(file => `
          <div class="file-item only-in-dev">
            <div class="file-name">${highlightText(file.name, textFilter)}</div>
            <div class="file-meta">
              <span><i class="fas fa-calendar"></i> ${formatDate(file.updated)}</span>
              <span><i class="fas fa-file"></i> ${formatBytes(file.size)}</span>
              <span class="badge only">Only in Dev</span>
            </div>
          </div>
        `).join('')
        : '<div class="empty">No files found</div>';
      
      document.getElementById('onlyInDevList').innerHTML = onlyInDevHtml;
      
      // Filter and render "Newer in Dev"
      const newerInDev = textFilter
        ? data.newerInDev.filter(f => f.name.toLowerCase().includes(textFilter))
        : data.newerInDev;
      
      const newerInDevHtml = newerInDev.length > 0
        ? newerInDev.map(file => `
          <div class="file-item newer-in-dev">
            <div class="file-name">${highlightText(file.name, textFilter)}</div>
            <div class="file-meta">
              <span><i class="fas fa-calendar-check"></i> Dev: ${formatDate(file.devUpdated)}</span>
              <span><i class="fas fa-calendar-times"></i> Prod: ${formatDate(file.prodUpdated)}</span>
              <span><i class="fas fa-clock"></i> ${file.ageDiffDays} days newer</span>
              <span><i class="fas fa-file"></i> ${formatBytes(file.devSize)}</span>
              <span class="badge newer">Newer</span>
            </div>
          </div>
        `).join('')
        : '<div class="empty">No files found</div>';
      
      document.getElementById('newerInDevList').innerHTML = newerInDevHtml;
      
      document.getElementById('resultsSection').style.display = 'grid';
    }
  </script>
</body>
</html>
