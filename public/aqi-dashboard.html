<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEVANTE AQI Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="./images/checkered-flags.svg" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="./css/theme.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: var(--fs-base);
      color: var(--text-primary);
      background: var(--color-bg);
      background-image:
        radial-gradient(circle at 0% 0%, rgba(12, 126, 155, 0.08), transparent 42%),
        radial-gradient(circle at 100% 100%, rgba(181, 120, 26, 0.06), transparent 42%);
      background-attachment: fixed;
    }

    .page-shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-pill);
      padding: 9px 14px;
    }

    .back-link:hover {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-pill);
      padding: 10px 16px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 600;
      cursor: pointer;
    }

    .refresh-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: 22px;
    }

    .panel h1 {
      margin: 0;
      font-size: var(--fs-2xl);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel p {
      margin: 10px 0 0;
      color: var(--text-secondary);
    }

    .meta-row {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--text-secondary);
      font-size: var(--fs-sm);
    }

    .status-text[data-kind="error"] { color: var(--color-danger); }
    .status-text[data-kind="success"] { color: var(--color-success); }
    .status-text[data-kind="loading"] { color: var(--accent); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .summary-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      min-height: 92px;
    }

    .summary-label {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: var(--fs-xs);
      font-weight: 700;
    }

    .summary-value {
      margin-top: 8px;
      font-size: var(--fs-2xl);
      font-weight: var(--fw-semibold);
      color: var(--text-primary);
    }

    .summary-detail {
      margin-top: 6px;
      color: var(--text-secondary);
      font-size: var(--fs-sm);
    }

    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .site-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .site-card-error {
      border-color: var(--color-danger-border);
      background: var(--color-danger-soft);
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .site-header h3 {
      margin: 0;
      font-size: var(--fs-base);
      font-weight: var(--fw-semibold);
    }

    .site-country {
      font-size: var(--fs-xs);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      border-radius: var(--radius-pill);
      padding: 4px 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .metric-label {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 2px;
      font-size: var(--fs-xl);
      font-weight: var(--fw-semibold);
      line-height: 1.15;
    }

    .metric-subtext {
      color: var(--text-secondary);
      font-size: var(--fs-xs);
      margin-top: 2px;
    }

    .metric-bar-wrap {
      width: 100%;
    }

    .metric-bar {
      width: 100%;
      height: 10px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .metric-bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--text-secondary);
      font-size: var(--fs-xs);
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
    }

    .site-error {
      margin: 0;
      color: var(--color-danger);
      font-size: var(--fs-sm);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="toolbar">
      <a class="back-link" href="./index.html">
        <i class="fas fa-arrow-left"></i>
        Back to Cockpit
      </a>
      <button id="refreshAqiBtn" class="refresh-btn" type="button">
        <i class="fas fa-rotate"></i>
        Refresh Data
      </button>
    </header>

    <section class="panel">
      <h1><i class="fas fa-wind"></i> LEVANTE AQI Dashboard</h1>
      <p>Live air quality index (AQI) and PM2.5 readings for Levante sites using the same real-time WAQI proxy API used by Locate Me.</p>
      <div class="meta-row">
        <span>Status: <strong id="statusText" class="status-text" data-kind="info">Not loaded yet</strong></span>
        <span>Last updated: <strong id="updatedAt">Not loaded yet</strong></span>
      </div>
    </section>

    <section id="summaryGrid" class="summary-grid"></section>
    <section id="siteGrid" class="site-grid"></section>
  </div>

  <script src="./js/aqi-dashboard.js"></script>
</body>
</html>
