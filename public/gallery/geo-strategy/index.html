<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Strategy Gallery - Levante</title>
    <link rel="icon" type="image/svg+xml" href="/images/location-pin.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 20% 20%, rgba(0, 160, 222, 0.22), rgba(15, 23, 42, 0.94)), #020617;
        color: #e2e8f0;
        padding: 28px 20px 48px;
      }
      header {
        max-width: 1400px;
        margin: 0 auto 28px;
        padding: 26px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(0, 160, 222, 0.95), rgba(56, 189, 248, 0.9));
        color: #03101f;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 40px rgba(2, 6, 23, 0.5);
      }
      header h1 {
        font-size: 28px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      header p {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .header-actions a {
        text-decoration: none;
        background: rgba(255, 255, 255, 0.85);
        color: #0b1220;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      .stats {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .stat {
        background: rgba(255, 255, 255, 0.85);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        color: #0b1220;
        font-weight: 600;
      }
      .stat.overlay {
        background: rgba(251, 191, 36, 0.9);
        color: #111827;
      }
      .filters {
        max-width: 1400px;
        margin: 0 auto 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .filter-btn {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(0, 160, 222, 0.4);
        background: rgba(7, 15, 28, 0.9);
        color: #e2e8f0;
        cursor: pointer;
        font-size: 13px;
      }
      .filter-btn.active {
        background: rgba(56, 189, 248, 0.85);
        color: #03101f;
        border-color: rgba(255, 255, 255, 0.6);
      }
      .grid {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      .card {
        background: rgba(7, 15, 28, 0.95);
        border-radius: 14px;
        padding: 16px;
        border: 1px solid rgba(56, 189, 248, 0.2);
        box-shadow: 0 18px 36px rgba(2, 6, 23, 0.45);
      }
      .card.changed {
        border-color: rgba(251, 191, 36, 0.9);
        box-shadow: 0 18px 36px rgba(2, 6, 23, 0.45), 0 0 0 1px rgba(251, 191, 36, 0.35);
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .meta {
        color: #cbd5e1;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: #e2e8f0;
        margin-bottom: 6px;
      }
      .pill {
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .label {
        color: #94a3b8;
      }
      .note {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 8px;
      }
      .hex-preview-wrap {
        margin: 8px 0 10px;
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 10px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.95));
      }
      .hex-preview-svg {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        height: auto;
      }
      .hex-preview-legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 8px 10px;
        font-size: 11px;
        color: #cbd5e1;
        border-top: 1px solid rgba(56, 189, 248, 0.18);
        background: rgba(2, 6, 23, 0.6);
      }
      .sw {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw i {
        font-size: 10px;
      }
      .empty {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-actions">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Pitwall</a>
        <a href="/gallery/locate-me/"><i class="fas fa-map"></i> Locate-Me Gallery</a>
        <a href="/gallery/geo-strategy/?overlay=20000"><i class="fas fa-layer-group"></i> Compare 50k vs 20k</a>
      </div>
      <h1>Geo Strategy Gallery</h1>
      <p>De-identified location strategy preview for the 46 demo sites. All raw GPS usage remains on-device; this gallery only uses curated seed points.</p>
      <div class="stats" id="stats"></div>
    </header>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>

    <script>
      const gridEl = document.getElementById('grid');
      const filtersEl = document.getElementById('filters');
      const statsEl = document.getElementById('stats');

      const formatNumber = (n) => {
        if (n === null || n === undefined || Number.isNaN(Number(n))) return 'N/A';
        return Number(n).toLocaleString();
      };
      const formatCoord = (v) => Number.isFinite(Number(v)) ? Number(v).toFixed(4) : 'N/A';

      function getRingFromFeature(feature) {
        const ring = feature?.geometry?.coordinates?.[0];
        return Array.isArray(ring) ? ring.filter((pt) => Array.isArray(pt) && pt.length >= 2) : [];
      }

      function computeBounds(points) {
        let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
        points.forEach(([lon, lat]) => {
          const x = Number(lon);
          const y = Number(lat);
          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          if (x < minLon) minLon = x;
          if (x > maxLon) maxLon = x;
          if (y < minLat) minLat = y;
          if (y > maxLat) maxLat = y;
        });
        if (!Number.isFinite(minLon) || !Number.isFinite(minLat) || !Number.isFinite(maxLon) || !Number.isFinite(maxLat)) {
          return null;
        }
        return { minLon, minLat, maxLon, maxLat };
      }

      function expandBounds(bounds, ratio = 0.2) {
        const lonSpan = Math.max(bounds.maxLon - bounds.minLon, 0.01);
        const latSpan = Math.max(bounds.maxLat - bounds.minLat, 0.01);
        const lonPad = lonSpan * ratio;
        const latPad = latSpan * ratio;
        return {
          minLon: bounds.minLon - lonPad,
          maxLon: bounds.maxLon + lonPad,
          minLat: bounds.minLat - latPad,
          maxLat: bounds.maxLat + latPad
        };
      }

      function projectPoint(lon, lat, bounds, width, height, pad = 12) {
        const usableW = width - pad * 2;
        const usableH = height - pad * 2;
        const lonSpan = Math.max(bounds.maxLon - bounds.minLon, 1e-9);
        const latSpan = Math.max(bounds.maxLat - bounds.minLat, 1e-9);
        const x = pad + ((Number(lon) - bounds.minLon) / lonSpan) * usableW;
        const y = height - pad - ((Number(lat) - bounds.minLat) / latSpan) * usableH;
        return [x, y];
      }

      function ringToSvgPath(ring, bounds, width, height) {
        if (!ring.length) return '';
        const pts = ring.map(([lon, lat]) => projectPoint(lon, lat, bounds, width, height));
        const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
        return `${d} Z`;
      }

      function estimateZoomForBounds(bounds, width, height, pad = 12) {
        const lonSpan = Math.max(bounds.maxLon - bounds.minLon, 1e-9);
        const latSpan = Math.max(bounds.maxLat - bounds.minLat, 1e-9);
        const usableW = Math.max(width - pad * 2, 1);
        const usableH = Math.max(height - pad * 2, 1);
        // Web Mercator-ish fit approximation.
        const zx = Math.log2((usableW * 360) / (256 * lonSpan));
        const zy = Math.log2((usableH * 170) / (256 * latSpan));
        const z = Math.floor(Math.min(zx, zy));
        return Math.max(1, Math.min(16, Number.isFinite(z) ? z : 8));
      }

      function lonLatToOsmTileFractional(lon, lat, zoom) {
        const z = Math.max(0, Math.min(19, Math.floor(Number(zoom) || 0)));
        const latRad = (Number(lat) * Math.PI) / 180;
        const n = 2 ** z;
        const x = ((Number(lon) + 180) / 360) * n;
        const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
        return {
          z,
          n,
          x: Math.max(0, Math.min(n - 1, x)),
          y: Math.max(0, Math.min(n - 1, y))
        };
      }

      function buildStaticMapTileQuad(centerLat, centerLon, zoom) {
        const t = lonLatToOsmTileFractional(centerLon, centerLat, zoom);
        const n = Math.max(1, Number(t.n || 1));
        const x0 = Math.round(t.x - 1);
        const y0 = Math.round(t.y - 1);
        const yStart = Math.max(0, Math.min(Math.max(0, n - 2), y0));
        const tiles = [];
        for (let dy = 0; dy < 2; dy += 1) {
          for (let dx = 0; dx < 2; dx += 1) {
            const xWrapped = ((x0 + dx) % n + n) % n;
            const yClamped = Math.max(0, Math.min(n - 1, yStart + dy));
            tiles.push({
              href: `https://tile.openstreetmap.org/${t.z}/${xWrapped}/${yClamped}.png`,
              x: dx * 256,
              y: dy * 256
            });
          }
        }
        return tiles;
      }

      function renderHexPreview(point, compare = null) {
        const baseFeature = point?.h3?.base?.outline || null;
        const effFeature = point?.h3?.effective?.outline || null;
        const overlayPoint = point?.__overlay || null;
        const overlayEffFeature = overlayPoint?.h3?.effective?.outline || null;
        const baseThreshold = Number(compare?.baseThreshold || point?.adm?.populationThreshold || 50000);
        const overlayThreshold = Number(compare?.overlayThreshold || 0);
        const baseRing = getRingFromFeature(baseFeature);
        const effRing = getRingFromFeature(effFeature);
        const overlayEffRing = getRingFromFeature(overlayEffFeature);
        if (!baseRing.length) {
          return '<div class="note">No H3 outline data available.</div>';
        }
        // Fit view to base (resolution 5) so it is always visible.
        const combinedBounds = computeBounds(baseRing.concat(overlayEffRing));
        const bounds = expandBounds(combinedBounds || computeBounds(baseRing), 0.25);
        const width = 512;
        const height = 512;
        const centerLat = Number(point?.fauxLocation?.lat);
        const centerLon = Number(point?.fauxLocation?.lon);
        const zoom = estimateZoomForBounds(bounds, width, height);
        const bgMapTiles = (Number.isFinite(centerLat) && Number.isFinite(centerLon))
          ? buildStaticMapTileQuad(centerLat, centerLon, zoom)
          : '';
        const bgMapMarkup = Array.isArray(bgMapTiles)
          ? bgMapTiles.map((tile) => `<image href="${tile.href}" x="${tile.x}" y="${tile.y}" width="256" height="256" preserveAspectRatio="none" opacity="0.6"></image>`).join('')
          : '';
        const basePath = ringToSvgPath(baseRing, bounds, width, height);
        const effPath = effRing.length ? ringToSvgPath(effRing, bounds, width, height) : '';
        const overlayEffPath = overlayEffRing.length ? ringToSvgPath(overlayEffRing, bounds, width, height) : '';
        const [fx, fy] = projectPoint(point?.fauxLocation?.lon, point?.fauxLocation?.lat, bounds, width, height);

        return `
          <div class="hex-preview-wrap">
            <svg class="hex-preview-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" aria-label="H3 hexagon preview">
              <rect x="0" y="0" width="${width}" height="${height}" fill="rgba(15,23,42,0.9)"></rect>
              ${bgMapMarkup}
              ${effPath ? `<path d="${effPath}" fill="rgba(244, 114, 182, 0.18)" stroke="#f472b6" stroke-width="${overlayEffPath ? 1.25 : 2}"></path>` : ''}
              ${overlayEffPath ? `<path d="${overlayEffPath}" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.35"></path>` : ''}
              ${overlayEffPath ? `<path d="${overlayEffPath}" fill="rgba(251, 191, 36, 0.08)" stroke="#f59e0b" stroke-width="3.4" stroke-dasharray="9 5"></path>` : ''}
              <path d="${basePath}" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4"></path>
              <circle cx="${fx.toFixed(2)}" cy="${fy.toFixed(2)}" r="4" fill="#22c55e" stroke="#052e16" stroke-width="1.2"></circle>
            </svg>
            <div class="hex-preview-legend">
              <span class="sw"><i style="color:#38bdf8">■</i> H3 Base (res 5)</span>
              <span class="sw"><i style="color:#f472b6">■</i> H3 Effective (${formatNumber(baseThreshold)})</span>
              ${overlayEffPath ? `<span class="sw"><i style="color:#f59e0b">■</i> H3 Effective (${formatNumber(overlayThreshold)})</span>` : ''}
              <span class="sw"><i style="color:#22c55e">●</i> Faux location</span>
            </div>
          </div>
        `;
      }

      function renderStats(data, overlayData, overlayThreshold, diffSummary = null) {
        const overlayStat = overlayData
          ? `<div class="stat overlay">Overlay threshold: ${formatNumber(overlayThreshold)}</div>`
          : '';
        const diffStat = diffSummary
          ? `<div class="stat overlay">Overlay deltas: H3 ${formatNumber(diffSummary.h3Changed)} · Tiles ${formatNumber(diffSummary.tileChanged)} · ADM2 ${formatNumber(diffSummary.adm2Changed)}</div>`
          : '';
        statsEl.innerHTML = `
          <div class="stat">Sites: ${data.points.length}</div>
          <div class="stat">Shift: ${data.shiftKm} km</div>
          <div class="stat">Pop threshold: ${formatNumber(data.populationThreshold)}</div>
          <div class="stat">Tile grid: ${data.tiles.gridSize}x${data.tiles.gridSize}</div>
          ${overlayStat}
          ${diffStat}
        `;
      }

      function renderFilters(points, setFilter) {
        const countries = Array.from(new Set(points.map((p) => p.country))).sort();
        const buttons = ['ALL', ...countries];
        filtersEl.innerHTML = '';
        buttons.forEach((code) => {
          const btn = document.createElement('button');
          btn.className = 'filter-btn' + (code === 'ALL' ? ' active' : '');
          btn.textContent = code;
          btn.onclick = () => {
            document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            setFilter(code === 'ALL' ? null : code);
          };
          filtersEl.appendChild(btn);
        });
      }

      function renderCards(points, overlayById = null, overlayThreshold = null, baseThreshold = null) {
        gridEl.innerHTML = '';
        points.forEach((p) => {
          const overlayPoint = overlayById ? overlayById.get(p.id) : null;
          if (overlayPoint) {
            p.__overlay = overlayPoint;
          }
          const card = document.createElement('div');
          card.className = 'card';
          const adm2 = p.adm?.adm2;
          const adm3 = p.adm?.adm3;
          const school = p.nearestSchool;
          const tileDiff = overlayPoint ? `${p.tileGrid?.sizeSelected || 'N/A'} -> ${overlayPoint.tileGrid?.sizeSelected || 'N/A'}` : null;
          const h3Diff = overlayPoint ? `r${p.h3?.effective?.resolution ?? 'N/A'} -> r${overlayPoint.h3?.effective?.resolution ?? 'N/A'}` : null;
          const adm2Diff = overlayPoint ? `${adm2 ? 'yes' : 'no'} -> ${overlayPoint?.adm?.adm2 ? 'yes' : 'no'}` : null;
          const h3Changed = overlayPoint ? (p.h3?.effective?.resolution !== overlayPoint?.h3?.effective?.resolution) : false;
          const tileChanged = overlayPoint ? (p.tileGrid?.sizeSelected !== overlayPoint?.tileGrid?.sizeSelected) : false;
          const adm2Changed = overlayPoint ? (Boolean(adm2) !== Boolean(overlayPoint?.adm?.adm2)) : false;
          const hasAnyOverlayChange = h3Changed || tileChanged || adm2Changed;
          const baseR8 = p?.h3?.candidates?.['8']?.population;
          const baseR9 = p?.h3?.candidates?.['9']?.population;
          const baseR7 = p?.h3?.candidates?.['7']?.population;
          const overlayR8 = overlayPoint?.h3?.candidates?.['8']?.population;
          const overlayR9 = overlayPoint?.h3?.candidates?.['9']?.population;
          const overlayR7 = overlayPoint?.h3?.candidates?.['7']?.population;
          card.innerHTML = `
            <h3>${p.label}</h3>
            <div class="meta">${p.country} - ${p.id}</div>
            ${renderHexPreview(p, { baseThreshold, overlayThreshold })}
            <div class="row">
              <div class="pill"><span class="label">GPS</span> ${formatCoord(p.gps?.lat)}, ${formatCoord(p.gps?.lon)}</div>
              <div class="pill"><span class="label">Faux</span> ${formatCoord(p.fauxLocation?.lat)}, ${formatCoord(p.fauxLocation?.lon)} (${p.fauxLocation?.direction})</div>
            </div>
            <div class="row">
              <div class="pill"><span class="label">Tiles</span> ${p.tileGrid?.sizeSelected || 'N/A'}x${p.tileGrid?.sizeSelected || 'N/A'}</div>
              <div class="pill"><span class="label">Tile Pop</span> ${formatNumber(p.tileGrid?.populationSelected)}</div>
              <div class="pill"><span class="label">Area</span> ${p.tileGrid?.areaKm2 || 'N/A'} km^2</div>
            </div>
            <div class="row">
              <div class="pill"><span class="label">H3 Base</span> ${
                p.h3?.base
                  ? `r${p.h3.base.resolution} · ${p.h3.base.id} · pop ${formatNumber(p.h3.base.population)}`
                  : '<span class="empty">N/A</span>'
              }</div>
              <div class="pill"><span class="label">H3 Effective</span> ${
                p.h3?.effective
                  ? `r${p.h3.effective.resolution} · ${p.h3.effective.id} · pop ${formatNumber(p.h3.effective.population)}`
                  : '<span class="empty">N/A</span>'
              }</div>
            </div>
            <div class="row">
              <div class="pill"><span class="label">ADM2</span> ${adm2 ? `${adm2.name} (${formatNumber(adm2.population)})` : '<span class="empty">N/A</span>'}</div>
              <div class="pill"><span class="label">ADM3</span> ${adm3 ? `${adm3.name} (${formatNumber(adm3.population)})` : '<span class="empty">N/A</span>'}</div>
            </div>
            <div class="row">
              <div class="pill"><span class="label">Weather</span> ${p.weather ? `${Math.round(p.weather.temperatureC)}C - ${p.weather.description}` : 'N/A'}</div>
              <div class="pill"><span class="label">Altitude</span> ${p.altitudeM !== null ? `${Math.round(p.altitudeM)} m` : 'N/A'}</div>
              <div class="pill"><span class="label">Density</span> ${p.populationDensityPerKm2 !== null ? `${formatNumber(p.populationDensityPerKm2)} / km^2` : 'N/A'}</div>
            </div>
            <div class="row">
              <div class="pill"><span class="label">Nearest School</span> ${
                school ? `${school.name} - ${school.distanceKm.toFixed(1)} km` : '<span class="empty">N/A</span>'
              }</div>
            </div>
            ${overlayPoint ? `
            <div class="row">
              <div class="pill"><span class="label">Overlay (${formatNumber(overlayThreshold)}) Tile size</span> ${tileDiff}</div>
              <div class="pill"><span class="label">Overlay H3 effective</span> ${h3Diff}</div>
              <div class="pill"><span class="label">Overlay ADM2 present</span> ${adm2Diff}</div>
            </div>` : ''}
            <div class="row">
              <div class="pill"><span class="label">r7/r8/r9 pop</span> ${formatNumber(baseR7)} / ${formatNumber(baseR8)} / ${formatNumber(baseR9)}</div>
              ${overlayPoint ? `<div class="pill"><span class="label">overlay r7/r8/r9 pop</span> ${formatNumber(overlayR7)} / ${formatNumber(overlayR8)} / ${formatNumber(overlayR9)}</div>` : ''}
            </div>
            ${overlayPoint ? `<div class="note">Overlay loaded: yes · change status: Tile ${tileChanged ? 'changed' : 'same'} · H3 ${h3Changed ? 'changed' : 'same'}</div>` : ''}
            <div class="note">Raw GPS is used on-device only; all remote lookups use de-identified coordinates.</div>
          `;
          if (hasAnyOverlayChange) {
            card.classList.add('changed');
          }
          gridEl.appendChild(card);
        });
      }

      const pageUrl = new URL(window.location.href);
      const basePath = pageUrl.pathname.endsWith('/') ? pageUrl.pathname : `${pageUrl.pathname}/`;
      const baseUrl = `${pageUrl.origin}${basePath}`;
      const params = new URLSearchParams(window.location.search);
      const overlayThresholdRaw = Number(params.get('overlay') || 0);
      const hasOverlay = Number.isInteger(overlayThresholdRaw) && overlayThresholdRaw > 0;
      const galleryDataUrl = new URL('gallery-data.json', baseUrl).toString();
      const overlayDataUrl = hasOverlay
        ? new URL(`gallery-data-${overlayThresholdRaw}.json`, baseUrl).toString()
        : null;

      Promise.all([
        fetch(galleryDataUrl).then((res) => res.json()),
        overlayDataUrl
          ? fetch(overlayDataUrl).then((res) => (res.ok ? res.json() : null)).catch(() => null)
          : Promise.resolve(null)
      ])
        .then(([data, overlayData]) => {
          const overlayById = overlayData
            ? new Map((overlayData.points || []).map((p) => [p.id, p]))
            : null;
          const diffSummary = overlayById
            ? data.points.reduce((acc, p) => {
                const o = overlayById.get(p.id);
                if (!o) return acc;
                if (p.h3?.effective?.resolution !== o.h3?.effective?.resolution) acc.h3Changed += 1;
                if (p.tileGrid?.sizeSelected !== o.tileGrid?.sizeSelected) acc.tileChanged += 1;
                if (Boolean(p?.adm?.adm2) !== Boolean(o?.adm?.adm2)) acc.adm2Changed += 1;
                return acc;
              }, { h3Changed: 0, tileChanged: 0, adm2Changed: 0 })
            : null;
          renderStats(data, overlayData, overlayThresholdRaw, diffSummary);
          renderFilters(data.points, (country) => {
            const filtered = country ? data.points.filter((p) => p.country === country) : data.points;
            renderCards(filtered, overlayById, overlayThresholdRaw, data.populationThreshold);
          });
          renderCards(data.points, overlayById, overlayThresholdRaw, data.populationThreshold);
        })
        .catch((err) => {
          gridEl.innerHTML = `<div class="card">Failed to load gallery data: ${err.message}</div>`;
        });
    </script>
  </body>
</html>
