<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Alternative Audio Clips</title>
    <link rel="icon" type="image/svg+xml" href="./audio-favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles.css">
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 150, 34, 0.18), rgba(15, 23, 42, 0.96)),
                linear-gradient(190deg, #020617 0%, #0b1220 100%);
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }

        .share-container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        header {
            margin-bottom: 28px;
        }

        .back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 2.3rem;
            margin: 0 0 10px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #f8fafc;
        }

        .actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-button {
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            white-space: nowrap;
        }

        .action-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .approve-button {
            background: linear-gradient(135deg, #ff6f00 0%, #ffb347 100%);
            color: #0b1220;
            box-shadow: 0 15px 35px rgba(255, 123, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .approve-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 22px 45px rgba(255, 123, 0, 0.45);
        }

        .log-button {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.9) 0%, rgba(14, 165, 233, 0.98) 100%);
            color: #03101f;
            box-shadow: 0 15px 36px rgba(56, 189, 248, 0.32);
            border: 1px solid rgba(56, 189, 248, 0.45);
        }

        .log-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 22px 46px rgba(56, 189, 248, 0.48);
        }

        .delete-button {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.92) 0%, rgba(127, 29, 29, 0.95) 100%);
            color: #fef2f2;
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.32);
            border: 1px solid rgba(248, 113, 113, 0.4);
        }

        .delete-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 22px 45px rgba(239, 68, 68, 0.45);
        }

        .folder-info {
            font-size: 0.95rem;
            color: rgba(148, 198, 255, 0.75);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status {
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 22px;
            font-size: 0.95rem;
            background: rgba(3, 12, 28, 0.85);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 18px 45px rgba(2, 6, 23, 0.45);
        }

        .status.error {
            background: rgba(76, 29, 36, 0.75);
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.4);
        }

        .status.success {
            background: rgba(13, 148, 136, 0.22);
            color: #5eead4;
            border-color: rgba(45, 212, 191, 0.4);
        }

        .status.loading {
            background: rgba(120, 53, 15, 0.35);
            color: #fdba74;
            border-color: rgba(251, 191, 36, 0.35);
        }

        .activity-log-panel {
            display: none;
            margin-bottom: 22px;
            padding: 18px 22px;
            border-radius: 18px;
            background: rgba(4, 11, 24, 0.82);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 22px 58px rgba(2, 6, 23, 0.5);
        }

        .activity-log-panel.is-open {
            display: block;
        }

        .activity-log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .activity-log-header h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #f8fafc;
        }

        .activity-log-close {
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .activity-log-close:hover {
            background: rgba(56, 189, 248, 0.25);
            color: #03101f;
            border-color: rgba(56, 189, 248, 0.45);
        }

        .activity-log-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .activity-log-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.18);
            background: rgba(8, 24, 46, 0.75);
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .activity-log-item .log-time {
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.75);
            letter-spacing: 0.05em;
        }

        .activity-log-item.success {
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(6, 78, 59, 0.4);
        }

        .activity-log-item.error {
            border-color: rgba(248, 113, 113, 0.4);
            background: rgba(76, 29, 36, 0.45);
        }

        .activity-log-item.warning {
            border-color: rgba(251, 191, 36, 0.4);
            background: rgba(120, 53, 15, 0.45);
        }

        .activity-log-empty {
            font-size: 0.9rem;
            color: rgba(148, 163, 184, 0.7);
            padding: 12px 0;
            text-align: center;
        }

        .share-content {
            background: rgba(4, 11, 24, 0.82);
            border-radius: 18px;
            box-shadow: 0 28px 70px rgba(2, 6, 23, 0.55);
            padding: 24px 28px;
            overflow-x: auto;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid rgba(56, 189, 248, 0.12);
        }

        th:first-child,
        td:first-child {
            text-align: center;
        }

        .file-select-checkbox,
        thead input[type="checkbox"] {
            transform: scale(1.15);
            cursor: pointer;
        }

        th {
            background: rgba(56, 189, 248, 0.12);
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        tr:hover {
            background: rgba(59, 130, 246, 0.12);
        }

        code {
            background: rgba(15, 23, 42, 0.8);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #93c5fd;
        }

        .empty-state {
            padding: 36px 0;
            text-align: center;
            color: rgba(148, 163, 184, 0.75);
        }

        .download-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .site-approval-cell { text-align: center; }
.site-approval-pill,
.status-pill {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            gap: 2px;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(148, 163, 184, 0.18);
            color: rgba(203, 213, 225, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .pill-subtext {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(203, 213, 225, 0.7);
        }

        .site-approval-pill.is-approved,
.status-pill.status-approved {
            background: rgba(250, 204, 21, 0.22);
            color: #fef08a;
            border-color: rgba(250, 204, 21, 0.4);
            box-shadow: 0 8px 18px rgba(250, 204, 21, 0.25);
        }

        .site-approval-pill.is-approved .pill-subtext,
.status-pill.status-approved .pill-subtext {
            color: rgba(254, 240, 138, 0.85);
        }

        .site-approval-pill.is-stale,
        .status-pill.status-stale {
            background: rgba(251, 191, 36, 0.22);
            color: #fde68a;
            border-color: rgba(251, 191, 36, 0.4);
            box-shadow: 0 8px 18px rgba(251, 191, 36, 0.25);
        }

        .site-approval-pill.is-stale .pill-subtext,
        .status-pill.status-stale .pill-subtext {
            color: rgba(253, 230, 138, 0.8);
        }

        .status-pill.status-not-approved {
            background: rgba(239, 68, 68, 0.2);
            color: #fecaca;
            border-color: rgba(239, 68, 68, 0.35);
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
        }

        .status-pill.status-not-approved .pill-subtext {
            color: rgba(254, 202, 202, 0.8);
        }

        .status-pill.status-ready {
            background: rgba(34, 197, 94, 0.22);
            color: #bbf7d0;
            border-color: rgba(34, 197, 94, 0.38);
            box-shadow: 0 8px 18px rgba(34, 197, 94, 0.25);
        }

        audio {
            width: 240px;
            max-width: 100%;
            filter: saturate(1.2);
        }

        .approval-note {
            margin-top: 26px;
            font-size: 0.9rem;
            color: rgba(148, 163, 184, 0.85);
            letter-spacing: 0.04em;
            text-transform: none;
        }

        @media (max-width: 640px) {
            .share-container {
                padding: 28px 16px 36px;
            }

            .actions-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            h1 {
                font-size: 1.9rem;
            }

            th, td {
                padding: 10px;
            }

            audio {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="share-container">
        <header>
            <div class="back-bar">
                <a class="back-to-pitwall" href="./index.html">
                    <i class="fas fa-arrow-left"></i> Back to Pitwall
                </a>
            </div>
            <h1>Review Alternative Audio Clips</h1>
            <div class="actions-bar">
                <div>
                    <div id="folderInfo" class="folder-info">Preparing share view…</div>
                    <div class="language-filter">
                        <label for="languageFilter">Language:</label>
                        <select id="languageFilter">
                            <option value="">All languages</option>
                        </select>
                    </div>
                </div>
                <div class="action-buttons">
                    <button id="deleteSelected" class="action-button delete-button" disabled>Delete Selected</button>
                    <button id="approveSelected" class="action-button approve-button" disabled>Approve Selected</button>
                    <button id="viewLogButton" class="action-button log-button" type="button">Activity Log</button>
                </div>
            </div>
        </header>

        <div id="status" class="status loading">Loading draft audio…</div>

        <div id="activityLogPanel" class="activity-log-panel" aria-live="polite" aria-expanded="false">
            <div class="activity-log-header">
                <h2>Activity Log</h2>
                <button id="activityLogClose" class="activity-log-close" type="button" title="Close activity log">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <ul id="activityLogList" class="activity-log-list">
                <li class="activity-log-empty">No activity yet.</li>
            </ul>
        </div>

        <div id="content" class="share-content">
            <div class="empty-state">Fetching draft audio files…</div>
        </div>
        <p class="approval-note">By approving these updated translations you&apos;re agreeing that they are acceptable for your Levante Project site.</p>
    </div>

    <script src="./js/draft-share.js"></script>
</body>
</html>
